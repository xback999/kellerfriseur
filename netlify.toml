# Netlify-Konfiguration für den Kellerfriseur.
# Es gibt keinen Build-Schritt: die Website besteht aus fertigen Dateien im Ordner "public",
# das Backend aus den Netlify Functions im Ordner "netlify/functions".

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Die Seite zur Terminverwaltung des Kunden (Link: https://deine-seite/termin#...)
[[redirects]]
  from = "/termin"
  to = "/termin/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Sicherheits-Header für alle Seiten.
# Die strenge Content-Security-Policy erlaubt nur Skripte und Styles von der eigenen Seite.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/termin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
